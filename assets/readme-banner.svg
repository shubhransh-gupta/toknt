<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" image-rendering="pixelated">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6eb5ff"/>
      <stop offset="55%" stop-color="#9bdcff"/>
      <stop offset="55%" stop-color="#5d9e2f"/>
      <stop offset="100%" stop-color="#4a7c23"/>
    </linearGradient>
    <pattern id="grass" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#5d9e2f"/>
      <rect width="16" height="8" fill="#6eb54a"/>
    </pattern>
    <pattern id="dirt" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#8b6914"/>
      <rect x="2" y="2" width="4" height="4" fill="#6b4f10"/>
      <rect x="10" y="8" width="3" height="3" fill="#6b4f10"/>
    </pattern>
  </defs>

  <!-- Sky + ground -->
  <rect width="720" height="280" fill="url(#sky)"/>

  <!-- Sun -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,4; 0,0" dur="4s" repeatCount="indefinite"/>
    <rect x="580" y="28" width="40" height="40" fill="#ffe066"/>
    <rect x="588" y="36" width="24" height="24" fill="#ffd700"/>
  </g>

  <!-- Cloud 1 -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="740 0" dur="28s" repeatCount="indefinite"/>
    <rect x="40" y="36" width="24" height="16" fill="#fff"/>
    <rect x="56" y="28" width="32" height="16" fill="#fff"/>
    <rect x="80" y="36" width="24" height="16" fill="#eef6ff"/>
  </g>

  <!-- Cloud 2 -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="-120 0" to="740 0" dur="36s" repeatCount="indefinite"/>
    <rect x="200" y="52" width="20" height="12" fill="#fff"/>
    <rect x="212" y="44" width="28" height="12" fill="#fff"/>
    <rect x="232" y="52" width="20" height="12" fill="#eef6ff"/>
  </g>

  <!-- Hills -->
  <rect x="0" y="168" width="720" height="16" fill="url(#grass)"/>
  <rect x="0" y="184" width="720" height="96" fill="url(#dirt)"/>

  <!-- Trees -->
  <g id="tree1">
    <rect x="88" y="136" width="16" height="32" fill="#5c4033"/>
    <rect x="72" y="120" width="48" height="16" fill="#2d6b30"/>
    <rect x="80" y="104" width="32" height="16" fill="#3d8b40"/>
  </g>
  <g id="tree2">
    <rect x="560" y="128" width="16" height="40" fill="#5c4033"/>
    <rect x="544" y="112" width="48" height="16" fill="#2d6b30"/>
    <rect x="552" y="96" width="32" height="16" fill="#3d8b40"/>
  </g>

  <!-- Floating blocks -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="3s" repeatCount="indefinite"/>
    <rect x="140" y="88" width="20" height="20" fill="#4ee4ef"/>
    <rect x="144" y="84" width="12" height="4" fill="#6ef0ff"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="2.5s" repeatCount="indefinite"/>
    <rect x="520" y="72" width="20" height="20" fill="#ffd700"/>
    <rect x="524" y="68" width="12" height="4" fill="#ffe566"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-12; 0,0" dur="3.5s" repeatCount="indefinite"/>
    <rect x="640" y="100" width="18" height="18" fill="#17dd62"/>
    <rect x="644" y="96" width="10" height="4" fill="#5dff9e"/>
  </g>

  <!-- XP orbs rising -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-40; 0,-80" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.5;0" dur="4s" repeatCount="indefinite"/>
    <rect x="320" y="150" width="8" height="8" fill="#17dd62"/>
  </g>
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-50; 0,-90" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.4;0" dur="5s" repeatCount="indefinite"/>
    <rect x="400" y="158" width="8" height="8" fill="#4ee4ef"/>
  </g>

  <!-- Title panel -->
  <rect x="160" y="108" width="400" height="56" fill="#141418" opacity="0.82"/>
  <rect x="160" y="108" width="400" height="4" fill="#5dff9e"/>
  <rect x="160" y="160" width="400" height="4" fill="#373737"/>

  <text x="360" y="132" text-anchor="middle" fill="#ffd700" font-family="monospace" font-size="14" font-weight="bold">Ï TOKN'T Ï</text>
  <text x="360" y="152" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11">Tokens? Tokn't.</text>
  <text x="360" y="168" text-anchor="middle" fill="#17dd62" font-family="monospace" font-size="9">Smelt token waste · Keep intelligence</text>

  <!-- Hotbar -->
  <rect x="240" y="188" width="240" height="36" fill="#373737"/>
  <rect x="248" y="196" width="28" height="28" fill="#8b8b8b" stroke="#555"/>
  <text x="262" y="216" text-anchor="middle" font-size="16">Ï</text>
  <rect x="280" y="196" width="28" height="28" fill="#8b8b8b" stroke="#555"/>
  <text x="294" y="216" text-anchor="middle" font-size="16">=Ž</text>
  <rect x="312" y="196" width="28" height="28" fill="#8b8b8b" stroke="#555"/>
  <text x="326" y="216" text-anchor="middle" font-size="16">=é</text>
  <rect x="344" y="196" width="28" height="28" fill="#8b8b8b" stroke="#555"/>
  <text x="358" y="216" text-anchor="middle" font-size="16">=æ</text>
  <rect x="376" y="196" width="28" height="28" fill="#8b8b8b" stroke="#555"/>
  <text x="390" y="216" text-anchor="middle" font-size="16">¡</text>
  <rect x="408" y="196" width="28" height="28" fill="#8b8b8b" stroke="#555"/>
  <text x="422" y="216" text-anchor="middle" font-size="16">=á</text>
  <rect x="440" y="196" width="28" height="28" fill="#8b8b8b" stroke="#555"/>
  <text x="454" y="216" text-anchor="middle" font-size="16">=Ê</text>
</svg>
